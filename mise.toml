[tools]
bun = "1.3.10"
prek = "0.3.4"

[hooks]
postinstall = "prek install"

[env]
_.path = [
  "{{ config_root }}/node_modules/.bin",
]

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run tstl in watch mode"
run = "bun --bun run dev"

[tasks.build]
description = "Build the project"
run = "bun --bun run build"

[tasks.lint]
description = "Lint and type check"
run = "bun --bun run lint"

[tasks.clean]
description = "Clean dist directory"
run = "rm -rf dist"

[tasks."local:deploy"]
description = "Build and deploy configuration to local ~/.config/wezterm"
run = [
  { task = "clean" },
  { task = "build" },
  "rsync -av --delete --delete-excluded dist/ ~/.config/wezterm",
]
